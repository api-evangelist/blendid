aid: blendid
name: Blendid
description: 'Blendid operates fully autonomous robotic smoothie kiosks that prepare
  chef-created blended beverages from real whole fruits, vegetables, seeds, nuts, and
  juice with no artificial flavors or added sugar. Each kiosk uses AI and robotics
  to run without on-site staff, taking mobile-app orders with customization and payment,
  producing up to eight simultaneous drinks and roughly thirty per hour. Blendid deploys
  its Blendid M2 platform into retail, colleges and universities, health clubs, and
  hospitals as a low-labor, low-capex, 24/7 automated food-service offering. It is
  tracked in the API Evangelist network as a portfolio company of Partech in the Food
  & Agritech sector; the company publishes no public developer API at this time.'
